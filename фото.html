function toast(msg,type='info',ms=3200){
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`<span class="t-ico">${icon({success:'success',error:'error',warn:'warn',info:'info'}[type]||'info',17)}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},ms);
}

/* ============================ KEYBOARD ============================ */
function bindKeyboard(){
  window.addEventListener('keydown',e=>{
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if(e.key==='Escape'){if(currentModal){closeModal();return;}closeMenu();if(App.cropRect){App.cropRect=null;needsRender=true;return;}if(App.selection){deselect();return;}return;}
    if(typing||currentModal)return;
    const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
    if(e.code==='Space'){if(!e.repeat){App.spaceDown=true;updateCursor();}e.preventDefault();return;}
    if(ctrl){
      let handled=true;
      if(k==='z'){e.shiftKey?redo():undo();}
      else if(k==='y')redo();
      else if(k==='n')openNewDocModal();
      else if(k==='o')$('#fileInput').click();
      else if(k==='s')openExportModal();
      else if(k==='e'){e.shiftKey?openExportModal():mergeDown();}
      else if(k==='a')selectAll();
      else if(k==='d')deselect();
      else if(k==='i'){e.shiftKey?invertSelection():cssFilter('invert(1)','Негатив');}
      else if(k==='u'&&e.shiftKey)cssFilter('grayscale(1)','Обесцветить');
      else if(k==='c')copyRegion(false);
      else if(k==='x')copyRegion(true);
      else if(k==='v')pasteClipboard();
      else if(k==='j')duplicateLayer();
      else if(k==='n'&&e.shiftKey)newLayer();
      else if(k==='0')fitView();
      else if(k==='1')setZoom(1);
      else if(k==='='||k==='+')setZoom(view.zoom*1.25);
      else if(k==='-')setZoom(view.zoom/1.25);
      else if(k==='r')toggleRulers();
      else if(k==="'")toggleGrid();
      else if(k===']')reorderLayer(1);
      else if(k==='[')reorderLayer(-1);
      else if(e.key==='Delete'||e.key==='Backspace')fillWith(App.bg,'Заливка фоном');
      else handled=false;
      if(handled)e.preventDefault();
      return;
    }
    if(e.altKey&&(e.key==='Delete'||e.key==='Backspace')){fillWith(App.fg,'Заливка цветом');e.preventDefault();return;}
    if(e.key==='Delete'||e.key==='Backspace'){clearRegion();e.preventDefault();return;}
    if(e.key==='Enter'&&App.cropRect){applyCrop();return;}
    const toolKeys={v:'move',m:'marquee',l:'lasso',c:'crop',i:'eyedropper',b:'brush',e:'eraser',t:'text',u:'shape',h:'hand',z:'zoom'};
    if(k==='g'){setTool(e.shiftKey?(App.tool==='fill'?'gradient':'fill'):'fill');return;}
    if(toolKeys[k]){if(k==='m'&&e.shiftKey){App.settings.select.kind=App.settings.select.kind==='rect'?'ellipse':'rect';renderOptions();}setTool(toolKeys[k]);return;}
    if(k==='x'){const t=App.fg;App.fg=App.bg;App.bg=t;updateColorUI();return;}
    if(k==='d'){App.fg='#000000';App.bg='#ffffff';updateColorUI();return;}
    if(k==='['||k===']'){const g=App.tool==='eraser'?'eraser':'brush';App.settings[g].size=clamp(App.settings[g].size+(k==='['?-2:2),1,300);renderOptions();needsRender=true;return;}
    if(k==='+'||k==='='){setZoom(view.zoom*1.25);return;}
    if(k==='-'){setZoom(view.zoom/1.25);return;}
    if(App.tool==='move'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
      const l=activeLayer();if(l&&!l.locked){const st=e.shiftKey?10:1;bakeMove(l.id,e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0,'Сдвиг слоя');}
      e.preventDefault();
    }
  });
  window.addEventListener('keyup',e=>{if(e.code==='Space'){App.spaceDown=false;updateCursor();}});
}

/* ============================ SEED ART ============================ */
function drawRange(ctx,baseY,amp,color,rnd,snow){
  const pts=[];const n=14;
  for(let i=0;i<=n;i++){const x=i*doc.w/n;const peak=baseY-amp*(.35+rnd()*.65)*(i%2?1:.55);pts.push({x,y:peak});}
  ctx.beginPath();ctx.moveTo(-20,doc.h+20);ctx.lineTo(-20,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(doc.w+20,pts[n].y);ctx.lineTo(doc.w+20,doc.h+20);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  if(snow){ctx.save();ctx.fillStyle='rgba(255,240,245,.85)';
    for(let i=1;i<n;i+=2){const p=pts[i];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-26,p.y+34);ctx.lineTo(p.x-8,p.y+26);ctx.lineTo(p.x+4,p.y+38);ctx.lineTo(p.x+22,p.y+30);ctx.closePath();ctx.fill();}
    ctx.restore();}
}
function seedDocument(){
  doc.w=1280;doc.h=800;doc.name='Альпийский закат';
  const rnd=mulberry32(20261114);
  const sky=createLayer('Небо');const s=sky.canvas.getContext('2d');
  const g=s.createLinearGradient(0,0,0,doc.h);
  g.addColorStop(0,'#10143a');g.addColorStop(.28,'#3b2a72');g.addColorStop(.52,'#8f3f8f');g.addColorStop(.72,'#e0607a');g.addColorStop(.88,'#ff9a5c');g.addColorStop(1,'#ffc978');
  s.fillStyle=g;s.fillRect(0,0,doc.w,doc.h);
  for(let i=0;i<150;i++){const x=rnd()*doc.w,y=rnd()*340,a=(1-y/340)*rnd()*.9;s.fillStyle=`rgba(255,255,255,${a})`;s.beginPath();s.arc(x,y,rnd()*1.4+.3,0,TAU);s.fill();}
  const sg=s.createRadialGradient(930,470,10,930,470,270);
  sg.addColorStop(0,'rgba(255,224,150,.95)');sg.addColorStop(.4,'rgba(255,170,100,.4)');sg.addColorStop(1,'rgba(255,140,90,0)');
  s.fillStyle=sg;s.fillRect(600,180,660,600);
  s.fillStyle='#ffe9b8';s.beginPath();s.arc(930,470,58,0,TAU);s.fill();
  const mountains=createLayer('Горы');const m=mountains.canvas.getContext('2d');
  drawRange(m,520,130,'#7a4a9e',rnd,true);
  drawRange(m,600,150,'#4a2d73',rnd,false);
  drawRange(m,690,160,'#241a45',rnd,false);
  const lake=createLayer('Озеро');const lk=lake.canvas.getContext('2d');
  const lg=lk.createLinearGradient(0,670,0,doc.h);lg.addColorStop(0,'#3a2a63');lg.addColorStop(1,'#12102a');
  lk.fillStyle=lg;lk.fillRect(0,670,doc.w,doc.h-670);
  const rg=lk.createLinearGradient(0,670,0,doc.h);rg.addColorStop(0,'rgba(255,210,140,.55)');rg.addColorStop(1,'rgba(255,160,90,0)');
  lk.fillStyle=rg;lk.fillRect(880,670,100,130);
  lk.strokeStyle='rgba(255,210,150,.35)';lk.lineWidth=1.5;
  for(let i=0;i<26;i++){const y=678+rnd()*115,w=20+rnd()*120,x=930-w/2+(rnd()-.5)*70;lk.globalAlpha=.2+rnd()*.5;lk.beginPath();lk.moveTo(x,y);lk.lineTo(x+w,y);lk.stroke();}
  lk.globalAlpha=1;
  const clouds=createLayer('Облака и птицы');const c=clouds.canvas.getContext('2d');
  c.filter='blur(16px)';
  const cloud=(cx,cy,sc,alpha)=>{c.fillStyle=`rgba(255,205,180,${alpha})`;for(let i=0;i<6;i++){c.beginPath();c.ellipse(cx+(i-2.5)*34*sc,cy+Math.sin(i)*10*sc,(46-i*4)*sc,(18-i)*sc,0,0,TAU);c.fill();}};
  cloud(300,190,1.1,.5);cloud(640,150,.8,.4);cloud(1050,230,1.2,.45);cloud(180,300,.7,.35);
  c.filter='blur(8px)';c.fillStyle='rgba(80,35,90,.35)';c.fillRect(0,430,doc.w,70);
  c.filter='none';c.strokeStyle='rgba(30,15,40,.8)';c.lineWidth=2.4;c.lineCap='round';
  [[380,215],[425,235],[465,208],[510,242]].forEach(([bx,by])=>{c.beginPath();c.moveTo(bx-9,by);c.quadraticCurveTo(bx-4,by-7,bx,by);c.quadraticCurveTo(bx+4,by-7,bx+9,by);c.stroke();});
  const typo=createLayer('Типографика');const t=typo.canvas.getContext('2d');
  t.save();t.shadowColor='rgba(10,5,25,.55)';t.shadowBlur=18;t.shadowOffsetY=5;
  t.font='800 92px Inter, sans-serif';t.textBaseline='top';
  const tg=t.createLinearGradient(70,0,640,0);tg.addColorStop(0,'#ffffff');tg.addColorStop(1,'#ffd9a0');
  t.fillStyle=tg;t.fillText('АЛЬПИЙСКИЙ',70,66);t.fillText('ЗАКАТ',70,162);
  t.restore();
  t.font='600 18px Inter, sans-serif';t.fillStyle='rgba(255,255,255,.82)';
  if('letterSpacing' in t)t.letterSpacing='5px';
  t.fillText('ДЕМО-ДОКУМЕНТ · СЛОИ · ЭКСПОРТ',74,278);
  if('letterSpacing' in t)t.letterSpacing='0px';
  t.fillStyle='rgba(10,8,24,.42)';
  const bx=1006,by=726,bw=232,bh=42;
  t.beginPath();t.roundRect(bx,by,bw,bh,11);t.fill();
  t.font='500 14px "JetBrains Mono", monospace';t.fillStyle='rgba(255,255,255,.85)';t.fillText('1280 × 800 · RGB/8',bx+20,by+13);
  doc.layers=[sky,mountains,lake,clouds,typo];doc.activeId=typo.id;
  App.selection=null;App.cropRect=null;resizeDocCanvases();
}

/* ============================ STATIC BINDINGS ============================ */
function bindStaticUI(){
  $('#undoBtn').innerHTML=icon('undo',17);$('#redoBtn').innerHTML=icon('redo',17);
  $('#panelToggle').innerHTML=icon('layers',17);$('#exportBtn .btn-ico').innerHTML=icon('download',16);
  $('#swapBtn').innerHTML=icon('swap',12);
  $('#zoomOut').innerHTML=icon('minusZ',15);$('#zoomIn').innerHTML=icon('plusZ',15);
  $('#btnNewLayer').innerHTML=icon('plus',16);$('#btnDupLayer').innerHTML=icon('copy',15);$('#btnMergeLayer').innerHTML=icon('merge',16);
  $('#btnUpLayer').innerHTML=icon('up',15);$('#btnDownLayer').innerHTML=icon('down',15);$('#btnDelLayer').innerHTML=icon('trash',15);
  $$('.panel-head .ph-ico').forEach((el,i)=>el.innerHTML=icon(['color','layers','history'][i]||'layers',14));
  $$('.panel-head .chev').forEach(el=>el.innerHTML=icon('chev',14));
  $('#blendSelect').innerHTML=BLENDS.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join('');
  $('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
  $('#exportBtn').onclick=openExportModal;
  $('#panelToggle').onclick=()=>$('#app').classList.toggle('panels-open');
  $('#zoomOut').onclick=()=>setZoom(view.zoom/1.25);$('#zoomIn').onclick=()=>setZoom(view.zoom*1.25);
  $('#zoomFit').onclick=fitView;$('#zoom100').onclick=()=>setZoom(1);
  $('#zoomInput').addEventListener('change',e=>{const v=parseFloat(e.target.value.replace(',','.').replace('%',''));if(!isNaN(v))setZoom(v/100);else updateZoomUI();});
  $('#zoomInput').addEventListener('keydown',e=>e.stopPropagation());
  $$('.panel-head[data-toggle]').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('collapsed')));
  $('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)openFile(f);e.target.value='';});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)needsRender=true;});
}

/* ============================ INIT ============================ */
async function init(){
  buildMenus();buildToolbar();bindMenus();bindStaticUI();bindColorUI();bindOptionsEvents();bindLayerEvents();bindCanvasEvents();bindKeyboard();
  if(window.agPsd&&agPsd.initializeCanvas){try{agPsd.initializeCanvas((w,h)=>makeCanvas(w,h));}catch(_){}}
  resizeView();
  new ResizeObserver(()=>resizeView()).observe(wrap);
  window.addEventListener('resize',resizeView);
  setTool('brush');renderOptions();updateColorUI();renderRecent();
  try{await Promise.race([Promise.all([document.fonts.load('800 92px Inter'),document.fonts.load('600 18px Inter'),document.fonts.load('500 14px "JetBrains Mono"')]),wait(1500)]);}catch(_){}
  seedDocument();resetHistory('Открытие документа');renderLayers();renderHistory();fitView();updateAllUI();
  requestAnimationFrame(loop);
  toast('Добро пожаловать в Photoshop Web. Документ со слоями открыт.','success',4200);
}
init();
})();
